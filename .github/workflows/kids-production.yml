name: Hikayatuna Kids - daily prepare

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Optional episode ID, e.g. kids-ep-001"
        required: false
        type: string
      prepare_only:
        description: "Prepare manifest and QA inputs only; never publish"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: hikayatuna-kids-production
  cancel-in-progress: false

env:
  KIDS_PRODUCTION_ENABLED: "false"
  KIDS_PUBLISH_ENABLED: "false"
  KIDS_TEXT_PROVIDER: "mock"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Backend tests import requests through the avatar provider module.
      - name: Install backend test dependency
        run: python -m pip install requests
      - name: Validate and prepare episode
        env:
          EPISODE_ID: ${{ inputs.episode_id || 'kids-ep-001' }}
        run: python -m core.kids_factory --mode prepare --episode-id "$EPISODE_ID"
      - name: Validate curated Arabic episode script
        env:
          EPISODE_ID: ${{ inputs.episode_id || 'kids-ep-001' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("content/production/kids") / os.environ["EPISODE_ID"] / "script.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert len(data.get("scenes", [])) == 6, "episode must have six scenes"
          assert all(s.get("narration") and s.get("dialogue") for s in data["scenes"]), "incomplete scene"
          assert data.get("publish_enabled") is False, "public publishing must remain disabled"
          print({"status": "curated_script_valid", "words": data.get("word_count")})
          PY
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Install media runtime
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only == false }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core espeak-ng
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts
      - name: Render private three-minute Arabic episode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only == false }}
        env:
          EPISODE_ID: ${{ inputs.episode_id || 'kids-ep-001' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/render_kids_episode.py --episode-id "$EPISODE_ID"
      - name: Verify rendered MP4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_only == false }}
        env:
          EPISODE_ID: ${{ inputs.episode_id || 'kids-ep-001' }}
        run: |
          VIDEO="content/production/kids/$EPISODE_ID/episode.mp4"
          test -s "$VIDEO"
          ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$VIDEO" | grep -q .
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")
          python -c 'import sys; d=float(sys.argv[1]); assert 179 <= d <= 181, f"duration out of range: {d}"' "$DURATION"
      - name: Persist review artifact
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "hikayatuna-kids-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/production/kids
          if git diff --cached --quiet; then
            echo "No new review artifact."
          else
            git commit -m "chore: prepare kids episode for review"
            git push
          fi
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikayatuna-kids-review-${{ github.run_number }}
          path: content/production/kids/
          if-no-files-found: error
          retention-days: 14
