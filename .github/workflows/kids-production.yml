name: Hikayatuna Kids - daily prepare

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Optional episode ID, e.g. kids-ep-001"
        required: false
        type: string
      prepare_only:
        description: "Prepare manifest and QA inputs only; never publish"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: hikayatuna-kids-production
  cancel-in-progress: true

env:
  KIDS_PRODUCTION_ENABLED: "false"
  KIDS_PUBLISH_ENABLED: "false"
  KIDS_TEXT_PROVIDER: "mock"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Backend tests import requests through the avatar provider module.
      - name: Install backend test dependency
        run: python -m pip install requests
      - name: Validate and prepare episode
        env:
          EPISODE_ID: ${{ inputs.episode_id || 'kids-ep-001' }}
        run: python -m core.kids_factory --mode prepare --episode-id "$EPISODE_ID"
      - name: Generate and validate Arabic script
        env:
          EPISODE_ID: ${{ inputs.episode_id || 'kids-ep-001' }}
        run: python -m core.kids_script_engine --episode-id "$EPISODE_ID" --provider mock
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts
      - name: Render private three-minute Arabic episode
        env:
          EPISODE_ID: ${{ inputs.episode_id || 'kids-ep-001' }}
        run: python tools/render_kids_episode.py --episode-id "$EPISODE_ID"
      - name: Verify rendered MP4
        env:
          EPISODE_ID: ${{ inputs.episode_id || 'kids-ep-001' }}
        run: |
          VIDEO="content/production/kids/$EPISODE_ID/episode.mp4"
          test -s "$VIDEO"
          ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$VIDEO" | grep -q .
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")
          python -c 'import sys; d=float(sys.argv[1]); assert 179 <= d <= 181, f"duration out of range: {d}"' "$DURATION"
      - name: Persist review artifact
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "hikayatuna-kids-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/production/kids
          if git diff --cached --quiet; then
            echo "No new review artifact."
          else
            git commit -m "chore: prepare kids episode for review"
            git push
          fi
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: hikayatuna-kids-review-${{ github.run_number }}
          path: content/production/kids/
          if-no-files-found: error
          retention-days: 14
