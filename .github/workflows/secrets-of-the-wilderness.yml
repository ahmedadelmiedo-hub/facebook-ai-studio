name: Secrets of the Wilderness — Build Episode

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode queue item
        required: true
        default: wilderness-001
        type: choice
        options:
          - wilderness-001

permissions:
  contents: read

concurrency:
  group: secrets-of-the-wilderness-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Arabic episode package
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python channels/secrets-of-the-wilderness/build_episode.py
      - name: Upload episode package
        uses: actions/upload-artifact@v4
        with:
          name: secrets-of-the-wilderness-episode-001
          path: channels/secrets-of-the-wilderness/output/
          if-no-files-found: error
          retention-days: 14
