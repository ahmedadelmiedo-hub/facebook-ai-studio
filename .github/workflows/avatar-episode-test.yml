name: Avatar episode test

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: "Approved script path in the repository"
        required: true
        default: "content/scripts/shorts/case-001-EP02-HOOK.txt"
        type: string
      episode_name:
        description: "Output episode name"
        required: true
        default: "case-001-EP02-AVATAR-TEST"
        type: string
      source_url:
        description: "HTTPS URL for the Nour reference image"
        required: true
        default: "https://files.manuscdn.com/user_upload_by_module/session_file/310519663829408040/fnhSKHjBzLDTeCTu.png"
        type: string

permissions:
  contents: read

jobs:
  avatar-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      D_ID_API_KEY: ${{ secrets.D_ID_API_KEY }}
      D_ID_SOURCE_URL: ${{ inputs.source_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify required secrets without printing them
        run: |
          test -n "$FISH_API_KEY"
          test -n "$FISH_VOICE_ID"
          test -n "$D_ID_API_KEY"
      - name: Run autopilot Avatar episode
        run: |
          PYTHONPATH=. python -m core.autopilot \
            --avatar-episode \
            --script-file "${{ inputs.script_file }}" \
            --voice "$FISH_VOICE_ID" \
            --format short \
            --episode-name "${{ inputs.episode_name }}" \
            --output-dir storage/autopilot/avatar-episode \
            --character-file content/characters/nour-podcast-host-v1.json \
            --scene-prompt "Nour narrates a mysterious case in her podcast studio" \
            --scene-camera "close medium shot, podcast microphone visible" \
            --avatar-source-url "$D_ID_SOURCE_URL" \
            --review-status approved \
            --keep-audio
      - name: Upload episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avatar-episode-${{ inputs.episode_name }}
          path: storage/autopilot/avatar-episode/
