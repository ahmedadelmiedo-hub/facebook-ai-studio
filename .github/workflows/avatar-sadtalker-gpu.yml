name: SadTalker GPU Avatar Episode

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: "Approved UTF-8 script path in the repository"
        required: true
        default: "content/scripts/shorts/case-001-EP02-HOOK.txt"
        type: string
      episode_name:
        description: "Output episode name"
        required: true
        default: "case-001-EP02-SADTALKER-TEST"
        type: string
      source_image:
        description: "Local Nour portrait path in the repository"
        required: true
        default: "storage/references/nour-master-v1.png"
        type: string
      avatar_max_characters:
        description: "Maximum narration characters per Avatar segment"
        required: true
        default: "900"
        type: string
      runner_label:
        description: "Label of the self-hosted CUDA runner"
        required: true
        default: "gpu"
        type: string
      sadtalker_root:
        description: "Absolute SadTalker checkout path on the runner"
        required: true
        default: "/opt/SadTalker"
        type: string
      sadtalker_python:
        description: "Absolute Python executable for the SadTalker environment"
        required: true
        default: "/opt/venvs/sadtalker/bin/python"
        type: string

permissions:
  contents: read

jobs:
  avatar-episode:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 360
    env:
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      AVATAR_PROVIDER: sadtalker
      SADTALKER_ROOT: ${{ inputs.sadtalker_root }}
      SADTALKER_PYTHON: ${{ inputs.sadtalker_python }}
      AVATAR_SOURCE_IMAGE: ${{ github.workspace }}/${{ inputs.source_image }}
      SADTALKER_ENHANCER: gfpgan
      SADTALKER_STILL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify CUDA and SadTalker environment
        run: |
          test -n "$FISH_API_KEY"
          test -n "$FISH_VOICE_ID"
          test -f "$SADTALKER_ROOT/inference.py"
          test -f "$AVATAR_SOURCE_IMAGE"
          command -v ffmpeg
          nvidia-smi
          "$SADTALKER_PYTHON" -c 'import torch; assert torch.cuda.is_available(), "CUDA is not available"; print(torch.cuda.get_device_name(0))'
      - name: Install lightweight project dependencies and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          "$SADTALKER_PYTHON" -m pip install -r requirements.txt
      - name: Run SadTalker Avatar episode
        run: |
          PYTHONPATH=. "$SADTALKER_PYTHON" -m core.autopilot \
            --avatar-episode \
            --avatar-provider sadtalker \
            --avatar-source-image "$AVATAR_SOURCE_IMAGE" \
            --script-file "${{ inputs.script_file }}" \
            --voice "$FISH_VOICE_ID" \
            --format long \
            --episode-name "${{ inputs.episode_name }}" \
            --output-dir storage/autopilot/avatar-sadtalker \
            --character-file content/characters/nour-podcast-host-v1.json \
            --scene-prompt "Nour narrates the full case from her podcast studio" \
            --scene-camera "cinematic medium shot with microphone and evidence board" \
            --avatar-max-characters "${{ inputs.avatar_max_characters }}" \
            --review-status approved \
            --keep-audio
      - name: Validate generated MP4
        run: |
          OUTPUT="$(find storage/autopilot/avatar-sadtalker -maxdepth 1 -type f -name '*.mp4' -print -quit)"
          test -n "$OUTPUT"
          test -s "$OUTPUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$OUTPUT"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$OUTPUT"
      - name: Upload episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avatar-sadtalker-${{ inputs.episode_name }}
          path: storage/autopilot/avatar-sadtalker/
