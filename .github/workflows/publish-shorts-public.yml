name: رواة الواقع - نشر Shorts الحالية للعامة

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-existing-shorts:
    name: Make existing promotional Shorts public
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_DEFAULT_LANGUAGE: ar
      YOUTUBE_CATEGORY_ID: "22"
      YOUTUBE_NOTIFY_SUBSCRIBERS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Make existing Shorts public
        run: python -m core.automation --publish-existing-shorts-now
      - name: Persist publication state
        run: |
          git config user.name "rowat-alwaqe-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add content/production content/scripts
          if git diff --cached --quiet; then
            echo "No publication state changes to commit."
          else
            git commit -m "chore: publish existing promotional Shorts"
            git push
          fi
