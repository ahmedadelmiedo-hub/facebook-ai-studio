name: إصلاح أصل ناقص ثم إنتاجه ونشره

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "معرّف القصة"
        required: true
        default: "case-001"
        type: string
      asset_id:
        description: "معرّف الأصل المطلوب إصلاحه ونشره"
        required: true
        default: "case-001-EP02-HOOK"
        type: string
      publish_long_now:
        description: "رفع الحلقة الطويلة Public فورًا بدل جدولتها"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rowat-alwaqe-repair-and-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate autonomous pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  repair-render-publish:
    name: Repair, render, schedule, and publish selected asset
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      FISH_MODEL: s2.1-pro-free
      SCRIPTWRITER_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SCRIPTWRITER_BASE_URL: https://api.groq.com/openai/v1
      SCRIPTWRITER_MODEL: openai/gpt-oss-120b
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_DEFAULT_LANGUAGE: ar
      YOUTUBE_CATEGORY_ID: "22"
      YOUTUBE_NOTIFY_SUBSCRIBERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Repair missing scripts
        run: python tools/repair_missing_scripts.py --story-id "${{ inputs.story_id }}" --asset-id "${{ inputs.asset_id }}"
      - name: Render and publish selected asset
        run: |
          if [[ "${{ inputs.publish_long_now }}" == "true" ]]; then
            python -m core.automation --publish-long-now
          else
            python -m core.automation --publish-short-now
          fi
      - name: Persist repaired scripts and publication state
        run: |
          git config user.name "rowat-alwaqe-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add content/production content/scripts
          if git diff --cached --quiet; then
            echo "No new scripts or publication state to commit."
          else
            git commit -m "chore: repair and publish selected story asset"
            git push
          fi
      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rowat-alwaqe-repair-run-${{ github.run_number }}
          path: |
            storage/autopilot/
            content/production/
          if-no-files-found: warn
          retention-days: 14
