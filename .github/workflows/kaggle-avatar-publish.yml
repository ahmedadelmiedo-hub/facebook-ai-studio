name: Fish Audio Episode and YouTube Publish

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: "Approved script path in the repository"
        required: true
        default: "content/scripts/long/case-001-EP02.txt"
        type: string
      episode_name:
        description: "Output episode name"
        required: true
        default: "case-001-EP02-FISH-AUDIO-FULL"
        type: string
      title:
        description: "YouTube title"
        required: true
        default: "ملف الرصد 17 | الحلقة 02 | رواة الواقع"
        type: string

permissions:
  contents: read

jobs:
  fish-audio-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_NOTIFY_SUBSCRIBERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify non-secret configuration
        run: |
          set -euo pipefail
          test -n "$FISH_API_KEY"
          test -n "$FISH_VOICE_ID"
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
      - name: Generate Fish Audio narration
        env:
          INPUT_SCRIPT: ${{ inputs.script_file }}
          INPUT_EPISODE: ${{ inputs.episode_name }}
        run: |
          set -euo pipefail
          rm -rf storage/autopilot/fish-audio
          mkdir -p storage/autopilot/fish-audio
          PYTHONPATH=. python -m core.autopilot \
            --audio-only \
            --script-file "$INPUT_SCRIPT" \
            --voice "$FISH_VOICE_ID" \
            --format long \
            --episode-name "$INPUT_EPISODE" \
            --output-dir storage/autopilot/fish-audio \
            --review-status approved \
            --tts-max-characters 2800 \
            --keep-audio
          AUDIO_PATH="storage/autopilot/fish-audio/${INPUT_EPISODE}.mp3"
          test -s "$AUDIO_PATH"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$AUDIO_PATH"
          echo "AUDIO_PATH=$AUDIO_PATH" >> "$GITHUB_ENV"
      - name: Render landscape episode with Arabic captions
        env:
          INPUT_SCRIPT: ${{ inputs.script_file }}
          INPUT_EPISODE: ${{ inputs.episode_name }}
        run: |
          set -euo pipefail
          VIDEO_PATH="storage/autopilot/fish-audio/${INPUT_EPISODE}.mp4"
          PYTHONPATH=. python tools/render_fish_episode.py \
            --audio "$AUDIO_PATH" \
            --script "$INPUT_SCRIPT" \
            --output "$VIDEO_PATH"
          test -s "$VIDEO_PATH"
          test -s "${VIDEO_PATH%.mp4}.ass"
          echo "VIDEO_PATH=$VIDEO_PATH" >> "$GITHUB_ENV"
      - name: Quality gate for episode MP4
        run: |
          set -euo pipefail
          test -s "$VIDEO_PATH"
          ffmpeg -v error -i "$VIDEO_PATH" -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$VIDEO_PATH"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$VIDEO_PATH"
      - name: Upload episode to YouTube as Public
        env:
          INPUT_EPISODE: ${{ inputs.episode_name }}
          INPUT_TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/upload_episode_public.py \
            --video "$VIDEO_PATH" \
            --asset-id "$INPUT_EPISODE" \
            --title "$INPUT_TITLE"
      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fish-audio-${{ inputs.episode_name }}
          path: |
            storage/autopilot/fish-audio/
