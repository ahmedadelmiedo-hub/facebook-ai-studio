name: Kaggle GPU Avatar Episode and YouTube Publish

on:
  workflow_dispatch:
    inputs:
      kaggle_kernel_id:
        description: "Kaggle kernel ID: your-kaggle-username/sadtalker-rowat-alwaqe"
        required: true
        default: "YOUR_KAGGLE_USERNAME/sadtalker-rowat-alwaqe"
        type: string
      script_file:
        description: "Approved script path in the repository"
        required: true
        default: "content/scripts/long/case-001-EP02.txt"
        type: string
      episode_name:
        description: "Output episode name"
        required: true
        default: "case-001-EP02-SADTALKER-KAGGLE-FULL"
        type: string
      avatar_max_characters:
        description: "Maximum narration characters per Avatar segment"
        required: true
        default: "1400"
        type: string
      run_short:
        description: "Run the Short smoke test before the full episode"
        required: true
        default: false
        type: boolean
      title:
        description: "YouTube title"
        required: true
        default: "ملف الرصد 17 | الحلقة 02 | رواة الواقع"
        type: string
      accelerator:
        description: "Kaggle free GPU accelerator"
        required: true
        default: "NvidiaTeslaP100"
        type: choice
        options:
          - NvidiaTeslaP100
          - NvidiaTeslaT4

permissions:
  contents: read

jobs:
  kaggle-gpu-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: ${{ inputs.kaggle_kernel_id }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_NOTIFY_SUBSCRIBERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Verify non-secret configuration
        run: |
          test -n "$KAGGLE_API_TOKEN"
          test -n "$KERNEL_ID"
          test "$KERNEL_ID" != "YOUR_KAGGLE_USERNAME/sadtalker-rowat-alwaqe"
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
      - name: Generate Avatar audio segments on GitHub
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          INPUT_SCRIPT: ${{ inputs.script_file }}
          INPUT_EPISODE: ${{ inputs.episode_name }}
          INPUT_MAX_CHARACTERS: ${{ inputs.avatar_max_characters }}
        run: |
          test -n "$FISH_API_KEY"
          test -n "$FISH_VOICE_ID"
          rm -rf storage/autopilot/github-avatar-audio
          mkdir -p storage/autopilot/github-avatar-audio
          PYTHONPATH=. python -m core.autopilot \
            --avatar-episode \
            --avatar-audio-only \
            --avatar-provider sadtalker \
            --avatar-source-image storage/references/nour-master-v1.png \
            --avatar-audio-dir storage/autopilot/github-avatar-audio \
            --script-file "$INPUT_SCRIPT" \
            --voice "$FISH_VOICE_ID" \
            --format long \
            --episode-name "$INPUT_EPISODE" \
            --output-dir storage/autopilot/github-avatar-audio \
            --character-file content/characters/nour-podcast-host-v1.json \
            --scene-prompt "Nour narrates the case from her podcast studio" \
            --scene-camera "cinematic medium shot with microphone and evidence board" \
            --avatar-max-characters "$INPUT_MAX_CHARACTERS" \
            --review-status approved \
            --keep-audio
          test "$(find storage/autopilot/github-avatar-audio -maxdepth 1 -name '*.mp3' | wc -l)" -gt 0
      - name: Create private Kaggle audio dataset
        run: |
          rm -rf .kaggle-audio-dataset
          mkdir -p .kaggle-audio-dataset
          cp storage/autopilot/github-avatar-audio/*.mp3 .kaggle-audio-dataset/
          KERNEL_SLUG="${KERNEL_ID#*/}"
          AUDIO_DATASET_ID="${KERNEL_ID%/*}/${KERNEL_SLUG}-audio"
          printf '%s\n' "KAGGLE_AUDIO_DATASET_ID=$AUDIO_DATASET_ID" >> "$GITHUB_ENV"
          jq -n \
            --arg id "$AUDIO_DATASET_ID" \
            --arg title "${KERNEL_SLUG}-audio" \
            '{title:$title, id:$id, subtitle:"Private precomputed avatar audio", description:"Private audio segments for one Rowat Alwaqe SadTalker render.", licenses:[{name:"other"}]}' \
            > .kaggle-audio-dataset/dataset-metadata.json
          kaggle datasets create -p .kaggle-audio-dataset --dir-mode zip
          dataset_ready=false
          for attempt in $(seq 1 12); do
            dataset_status="$(kaggle datasets status -d "$AUDIO_DATASET_ID" 2>&1 || true)"
            echo "Dataset status check ${attempt}/12: ${dataset_status}"
            normalized_status="$(printf '%s' "$dataset_status" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$normalized_status" | grep -Eqi 'ready|complete|success'; then
              dataset_ready=true
              break
            fi
            if printf '%s' "$normalized_status" | grep -Eqi '403|forbidden'; then
              echo "Kaggle status endpoint is forbidden for this token; waiting 90s for dataset processing before kernel push."
              sleep 90
              dataset_ready=true
              break
            fi
            if printf '%s' "$normalized_status" | grep -Eqi 'error|failed|invalid|not found|unauthorized'; then
              echo "Kaggle audio dataset did not become available: ${dataset_status}"
              exit 1
            fi
            sleep 15
          done
          if [ "$dataset_ready" != "true" ]; then
            echo "Kaggle audio dataset was not ready after waiting."
            exit 1
          fi
      - name: Prepare Kaggle kernel package
        env:
          INPUT_SCRIPT: ${{ inputs.script_file }}
          INPUT_EPISODE: ${{ inputs.episode_name }}
          INPUT_MAX_CHARACTERS: ${{ inputs.avatar_max_characters }}
          INPUT_RUN_SHORT: ${{ inputs.run_short }}
          INPUT_ACCELERATOR: ${{ inputs.accelerator }}
        run: |
          rm -rf .kaggle-kernel kaggle-output
          mkdir -p .kaggle-kernel kaggle-output
          AUDIO_DATASET_ID="$KAGGLE_AUDIO_DATASET_ID"
          test -n "$AUDIO_DATASET_ID"
          KERNEL_SLUG="${KERNEL_ID#*/}"
          cp notebooks/sadtalker_kaggle_gpu.ipynb .kaggle-kernel/sadtalker_kaggle_gpu.ipynb
          jq -n \
            --arg script "$INPUT_SCRIPT" \
            --arg episode "$INPUT_EPISODE" \
            --arg output "storage/autopilot/avatar-sadtalker-kaggle-full" \
            --argjson max_characters "$INPUT_MAX_CHARACTERS" \
            --argjson run_short "$INPUT_RUN_SHORT" \
            --arg accelerator "$INPUT_ACCELERATOR" \
            --arg audio_dataset_id "$AUDIO_DATASET_ID" \
            --arg audio_dir "/kaggle/input/${KERNEL_SLUG}-audio" \
            '{script_file:$script, episode_name:$episode, output_dir:$output, max_characters:$max_characters, run_short:$run_short, accelerator:$accelerator, audio_dataset_id:$audio_dataset_id, audio_dir:$audio_dir, voice_id:"precomputed"}' \
            > .kaggle-kernel/job_config.json
          KERNEL_SLUG="${KERNEL_ID#*/}"
          jq -n \
            --arg id "$KERNEL_ID" \
            --arg title "$KERNEL_SLUG" \
            --arg machine_shape "$INPUT_ACCELERATOR" \
            --arg dataset "$AUDIO_DATASET_ID" \
            '{id:$id, title:$title, code_file:"sadtalker_kaggle_gpu.ipynb", language:"python", kernel_type:"notebook", is_private:true, enable_gpu:true, enable_tpu:false, enable_internet:true, machine_shape:$machine_shape, dataset_sources:[$dataset], competition_sources:[], kernel_sources:[]}' \
            > .kaggle-kernel/kernel-metadata.json
          jq empty .kaggle-kernel/job_config.json
          jq empty .kaggle-kernel/kernel-metadata.json
      - name: Push and run Kaggle notebook on Kaggle GPU
        run: |
          pushed=false
          for attempt in 1 2 3 4 5; do
            if kaggle kernels push -p .kaggle-kernel --accelerator "${{ inputs.accelerator }}" --timeout 10800; then
              pushed=true
              break
            fi
            echo "Kaggle Push attempt ${attempt}/5 failed; retrying after backoff."
            sleep $((attempt * 20))
          done
          if [ "$pushed" != "true" ]; then
            echo "Kaggle Push failed after 5 attempts."
            exit 1
          fi
      - name: Wait for Kaggle kernel completion
        run: |
          # A full SadTalker episode can exceed one hour on a free T4.
          # Keep the GitHub job alive long enough to retrieve the completed MP4.
          max_attempts=180
          completed=false
          mkdir -p kaggle-output/status
          for attempt in $(seq 1 "$max_attempts"); do
            status_output="$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)"
            normalized_status="$(printf '%s' "$status_output" | tr '[:upper:]' '[:lower:]')"
            printf '%s\n' "$status_output" | tee "kaggle-output/status/check-${attempt}.txt"
            {
              echo "### Kaggle status check ${attempt}/${max_attempts}"
              echo '```text'
              printf '%s\n' "$status_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if printf '%s' "$normalized_status" | grep -Eqi 'error|failed|cancelled|canceled|dead|invalid|not found|unauthorized'; then
              echo "Kaggle kernel returned a terminal failure state."
              exit 1
            fi
            if printf '%s' "$normalized_status" | grep -Eqi 'complete|succeeded|success'; then
              completed=true
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep 60
            fi
          done
          if [ "$completed" != "true" ]; then
            echo "Kaggle kernel did not reach a terminal success state within ${max_attempts} minutes. It may be queued or unavailable on the selected accelerator."
            exit 1
          fi
      - name: Download MP4 output from Kaggle
        run: |
          kaggle kernels output "$KERNEL_ID" --path kaggle-output --force --file-pattern '.*\.mp4$'
          VIDEO_PATH="$(find kaggle-output -type f -name '*.mp4' -print -quit)"
          test -n "$VIDEO_PATH"
          mkdir -p storage/autopilot/kaggle-import
          cp "$VIDEO_PATH" "storage/autopilot/kaggle-import/${{ inputs.episode_name }}.mp4"
          echo "VIDEO_PATH=storage/autopilot/kaggle-import/${{ inputs.episode_name }}.mp4" >> "$GITHUB_ENV"
      - name: Quality gate for episode MP4
        run: |
          test -s "$VIDEO_PATH"
          ffmpeg -v error -i "$VIDEO_PATH" -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$VIDEO_PATH"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$VIDEO_PATH"
      - name: Install YouTube uploader dependencies
        run: python -m pip install -r requirements.txt
      - name: Upload episode to YouTube as Public
        run: |
          PYTHONPATH=. python tools/upload_episode_public.py \
            --video "$VIDEO_PATH" \
            --asset-id "${{ inputs.episode_name }}" \
            --title "${{ inputs.title }}"
      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-avatar-${{ inputs.episode_name }}
          path: |
            storage/autopilot/kaggle-import/
            storage/autopilot/github-avatar-audio/
            kaggle-output/
