name: مصنع الملف 71 - 4 حلقات يوميا
on:
  schedule:
    - cron: '0 6,12,18,21 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts moviepy -q
      - run: python core/autopilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: storage/autopilot/*.mp4
