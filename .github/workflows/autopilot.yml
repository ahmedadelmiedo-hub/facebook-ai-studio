name: أسرار البرية - إنتاج بمراجعة بشرية

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "اختبار التخطيط والملفات فقط بدون Fish Audio أو YouTube"
        required: true
        default: false
        type: boolean
      approve_asset_id:
        description: "اكتب Asset ID الذي راجعته ووافقت صراحة على نشره؛ اتركه فارغًا لإنشاء معاينة فقط"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: secrets-of-wildlife-reviewed-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate wildlife documentary pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  produce-and-publish:
    name: Prepare preview or publish an explicitly approved asset
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      FISH_MODEL: s2.1-pro-free
      SCRIPTWRITER_API_KEY: ${{ secrets.SCRIPTWRITER_API_KEY }}
      SCRIPTWRITER_BASE_URL: https://api.groq.com/openai/v1
      SCRIPTWRITER_MODEL: openai/gpt-oss-120b
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_DEFAULT_LANGUAGE: ar
      YOUTUBE_CATEGORY_ID: "22"
      YOUTUBE_NOTIFY_SUBSCRIBERS: "true"
      APPROVE_ASSET_ID: ${{ inputs.approve_asset_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure media tools
        run: python tools/configure_media_tools.py
      - name: Run autonomous content job
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN_INPUT" == "true" ]]; then
            python -m core.automation --dry-run
          elif [[ -n "$APPROVE_ASSET_ID" ]]; then
            python -m core.automation --approve-asset-id "$APPROVE_ASSET_ID"
          else
            python -m core.automation
          fi
      - name: Persist generated scripts and publication state
        run: |
          git config user.name "rowat-alwaqe-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add content/production content/scripts
          if git diff --cached --quiet; then
            echo "No new scripts or publication state to commit."
          else
            git commit -m "chore: persist autonomous story production state"
            git push
          fi
      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: secrets-of-wildlife-run-${{ github.run_number }}
          path: |
            storage/autopilot/
            content/production/
          if-no-files-found: warn
          retention-days: 14
